name: Android CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        id: build
        env:
          ZAJEL_KEYSTORE_BASE64: ${{ secrets.ZAJEL_KEYSTORE_BASE64 }}
          ZAJEL_KEYSTORE_PASSWORD: ${{ secrets.ZAJEL_KEYSTORE_PASSWORD }}
          ZAJEL_KEY_ALIAS: ${{ secrets.ZAJEL_KEY_ALIAS }}
          ZAJEL_KEY_PASSWORD: ${{ secrets.ZAJEL_KEY_PASSWORD }}
        run: |
          if [ -n "$ZAJEL_KEYSTORE_BASE64" ]; then
            echo "$ZAJEL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zajel-release.jks"
            export ZAJEL_KEYSTORE_FILE="$RUNNER_TEMP/zajel-release.jks"
            gradle --no-daemon :app:assembleRelease
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Stable signing secrets are not configured; building debug APK only."
            gradle --no-daemon :app:assembleDebug
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload signed update APK
        if: success() && steps.build.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zajel-update-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Upload debug APK
        if: success() && steps.build.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zajel-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
